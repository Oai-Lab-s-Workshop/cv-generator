<main class="template-gallery-page">
  <section class="template-gallery-page__hero">
    <div>
      <p class="template-gallery-page__eyebrow">Apercus</p>
      <h1>Tous les templates</h1>
      <p>Cette galerie utilise des donnees de demonstration en francais issues du seed du projet.</p>
    </div>

    @if (isAuthenticated()) {
      <a routerLink="/home" class="template-gallery-page__back">Retour a l'accueil</a>
    }
  </section>

  <app-template-preview-list [allowA4Toggle]="true" [forceA4]="false" [autoLoop]="false"></app-template-preview-list>
</main>
