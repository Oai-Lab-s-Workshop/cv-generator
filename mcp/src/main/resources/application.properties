spring.application.name=resumate-mcp

server.port=${PORT:${MCP_INTERNAL_PORT:8081}}

spring.ai.mcp.server.protocol=STATELESS
spring.ai.mcp.server.name=resumate-mcp
spring.ai.mcp.server.version=0.1.0
spring.ai.mcp.server.instructions=Use these tools when the user asks to tailor, craft, adapt, customize, or generate a resume/CV for a specific job listing or job description. First inspect the user's existing CV material and the supported templates, then create a tailored public CV profile using only the authenticated user's already-owned records. Do not invent qualifications or experience, and do not create new source records such as jobs, projects, or achievements.
spring.ai.mcp.server.capabilities.tool=true
spring.ai.mcp.server.capabilities.resource=true
spring.ai.mcp.server.capabilities.prompt=true
spring.ai.mcp.server.capabilities.completion=false
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp

resumate.frontend.base-url=${SERVICE_FQDN_FRONTEND:${FRONTEND_BASE_URL:http://localhost:${FRONTEND_PORT:4200}}}
resumate.pocketbase.base-url=${POCKETBASE_BASE_URL:http://localhost:${POCKETBASE_PORT:8090}}
resumate.pocketbase.service-user-email=${POCKETBASE_SERVICE_USER_EMAIL:}
resumate.pocketbase.service-user-password=${POCKETBASE_SERVICE_USER_PASSWORD:}

resumate.oauth.public-base-url=${MCP_PUBLIC_BASE_URL}
resumate.oauth.jwk=${MCP_OAUTH_JWK}
resumate.oauth.access-token-ttl=${MCP_OAUTH_ACCESS_TOKEN_TTL:1h}
resumate.oauth.refresh-token-ttl=${MCP_OAUTH_REFRESH_TOKEN_TTL:90d}
resumate.oauth.allowed-redirect-uri-patterns=${MCP_OAUTH_ALLOWED_REDIRECT_URI_PATTERNS:https://claude.ai/*}
