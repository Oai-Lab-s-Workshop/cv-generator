@if (isDesktop) {
  <header class="title-bar">
    <div class="drag-region">
      <span class="app-name">Resumate</span>
    </div>
    <div class="window-controls">
      <button type="button" class="window-btn minimize" (click)="minimize($event)" aria-label="Minimize">
        <svg width="10" height="2" viewBox="0 0 10 2" fill="currentColor">
          <rect y="0.5" width="10" height="1" rx="0.5" />
        </svg>
      </button>
      <button type="button" class="window-btn maximize" (click)="maximize($event)" aria-label="Maximize">
        <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.2">
          <rect x="0.6" y="0.6" width="8.8" height="8.8" rx="1" />
        </svg>
      </button>
      <button type="button" class="window-btn close" (click)="close($event)" aria-label="Close">
        <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.2">
          <path d="M1.5 1.5L8.5 8.5M8.5 1.5L1.5 8.5" stroke-linecap="round" />
        </svg>
      </button>
    </div>
  </header>
}
