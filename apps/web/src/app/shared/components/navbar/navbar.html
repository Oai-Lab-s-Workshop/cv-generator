<header class="topbar">
  <div class="topbar__inner">
    <a class="brand" routerLink="/home" aria-label="Accueil Resumate" (click)="closeMenu()">
      <img src="/assets/affiche/logo.png" alt="">
      <span>Resumate <small>Console</small></span>
    </a>

    @if (isAuthenticated()) {
      <nav
        class="main-nav"
        aria-label="Navigation principale"
        [attr.data-open]="menuOpen() ? 'true' : null"
      >
        <a routerLink="/home" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }" ariaCurrentWhenActive="page" (click)="closeMenu()">Accueil</a>
        <a routerLink="/home/profile-material" routerLinkActive="is-active" ariaCurrentWhenActive="page" (click)="closeMenu()">Informations</a>
        <a routerLink="/home/templates" routerLinkActive="is-active" ariaCurrentWhenActive="page" (click)="closeMenu()">Modèles</a>
        <a routerLink="/home/tokens" routerLinkActive="is-active" ariaCurrentWhenActive="page" (click)="closeMenu()">Tokens MCP</a>
      </nav>

      <div class="top-actions">
        <button
          class="theme-toggle"
          type="button"
          aria-label="Changer de thème"
          [attr.aria-pressed]="themeService.currentTheme() === 'light'"
          (click)="toggleTheme()"
        >
          <span class="theme-toggle__glyph" aria-hidden="true"></span>
          <span class="theme-toggle__label">{{ themeService.currentTheme() === 'light' ? 'Sombre' : 'Clair' }}</span>
        </button>
        @if (bugReportUrl()) {
          <a class="top-action" [href]="bugReportUrl()" target="_blank" rel="noopener noreferrer">Signaler un bug</a>
        }
        <a class="top-action" routerLink="/home/account" (click)="closeMenu()">Compte</a>
        <button class="top-action top-action--danger" type="button" (click)="logout()">Sortir</button>
        <button
          class="mobile-menu"
          type="button"
          aria-label="Ouvrir la navigation"
          [attr.aria-expanded]="menuOpen()"
          (click)="toggleMenu()"
        >☰</button>
      </div>
    }
  </div>
</header>

@if (isLoggingOut()) {
  <div class="logout-overlay" aria-live="assertive" aria-label="Déconnexion en cours">
    <div class="logout-overlay__status">
      <span class="logout-overlay__mark" aria-hidden="true">...</span>
      <span>Déconnexion en cours</span>
    </div>
  </div>
}
