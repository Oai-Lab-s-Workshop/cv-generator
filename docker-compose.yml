services:
  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    container_name: resumate-pb
    restart: unless-stopped
    command: serve --http=0.0.0.0:${POCKETBASE_INTERNAL_PORT:-8090} --dir=/pb_data --publicDir=/pb_public --hooksDir=/pb_hooks --migrationsDir=/pb_migrations
    ports:
      - "${POCKETBASE_PORT:-8090}:${POCKETBASE_INTERNAL_PORT:-8090}"
    environment:
      TZ: UTC
      PB_HOST: 0.0.0.0
      PB_PORT: ${POCKETBASE_INTERNAL_PORT:-8090}
      PB_ADMIN_EMAIL: ${PB_ADMIN_EMAIL:-admin@cv-generator.local}
      PB_ADMIN_PASSWORD: ${PB_ADMIN_PASSWORD:-changeme123!}
    volumes:
      - ./pb_data:/pb_data
      - ./pb_migrations:/pb_migrations
      - ./pb_hooks:/pb_hooks
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:${POCKETBASE_INTERNAL_PORT:-8090}/api/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  mcp:
    build:
      context: ./mcp
      dockerfile: Dockerfile
    container_name: resumate-mcp
    restart: unless-stopped
    ports:
      - "${MCP_PORT:-8081}:${MCP_INTERNAL_PORT:-8081}"
    environment:
      PORT: ${MCP_INTERNAL_PORT:-8081}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:${FRONTEND_PORT:-4200}}
      POCKETBASE_BASE_URL: ${POCKETBASE_BASE_URL:-http://pocketbase:${POCKETBASE_INTERNAL_PORT:-8090}}
      POCKETBASE_SERVICE_USER_EMAIL: ${POCKETBASE_SERVICE_USER_EMAIL:-}
      POCKETBASE_SERVICE_USER_PASSWORD: ${POCKETBASE_SERVICE_USER_PASSWORD:-}
    depends_on:
      pocketbase:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: resumate-web
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    environment:
      BUG_REPORT_URL: ${BUG_REPORT_URL:-}
      POCKETBASE_INTERNAL_PORT: ${POCKETBASE_INTERNAL_PORT:-8090}
    depends_on:
      pocketbase:
        condition: service_healthy
