spring.application.name=resumate-mcp

server.port=${PORT:${MCP_INTERNAL_PORT:8081}}

spring.ai.mcp.server.protocol=STATELESS
spring.ai.mcp.server.name=resumate-mcp
spring.ai.mcp.server.version=0.1.0
spring.ai.mcp.server.instructions=Use these Resumate tools when the user asks to tailor, craft, adapt, customize, or generate a resume/CV for a specific job listing or job description. Follow this ordered workflow. 1) Call listTemplates first and use exactly one returned template id; never invent template ids. 2) Call listProfileMaterial to retrieve the authenticated user's existing skills, jobs, projects, achievements, degrees, and hobbies; use only record ids returned by these tools. 3) Review all returned user material together to form a holistic portrait of the user's real specialization, seniority, and strengths before making any selection. 4) Select the subset of jobs, skills, projects, achievements, degrees, and hobbies that best evidences fit with the target offer; do not invent qualifications or experience the user does not have, and do not create new source records such as jobs, projects, or achievements. 5) Derive profileName as the displayed role title: a coherent middle ground between the user's own skills and specialization and the needs of the target offer. Do not copy the job offer listing title verbatim, and never include the user's name in profileName. 6) Only after every other selection is final, draft professionalSummary so it reflects and valorizes that exact combination of selected material and its relevance to the offer. 7) Call createTailoredCvProfile with: a non-empty label (saved-resume dashboard name), the profileName you derived, the professionalSummary you drafted, the chosen template id, the selected record ids for jobs, skills, projects, achievements, degrees, and hobbies, supported template extras when applicable, and an idempotencyKey scoped to the job offer so retries do not create duplicate profiles. Check the deduplicated field in the response -- when true your create was rerouted to updateCvProfile on the existing profile (normal success). To edit an existing profile, use updateCvProfile and pass only the fields you want to change (PATCH semantics).
spring.ai.mcp.server.capabilities.tool=true
spring.ai.mcp.server.capabilities.resource=true
spring.ai.mcp.server.capabilities.prompt=true
spring.ai.mcp.server.capabilities.completion=false
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp

resumate.frontend.base-url=${SERVICE_FQDN_FRONTEND:${FRONTEND_BASE_URL:http://localhost:${FRONTEND_PORT:4200}}}
resumate.pocketbase.base-url=${POCKETBASE_BASE_URL:http://pocketbase:${POCKETBASE_INTERNAL_PORT:8090}}
resumate.pocketbase.service-user-email=${POCKETBASE_SERVICE_USER_EMAIL:}
resumate.pocketbase.service-user-password=${POCKETBASE_SERVICE_USER_PASSWORD:}

resumate.oauth.public-base-url=${MCP_PUBLIC_BASE_URL}
resumate.oauth.jwk=${MCP_OAUTH_JWK}
resumate.oauth.access-token-ttl=${MCP_OAUTH_ACCESS_TOKEN_TTL:1h}
resumate.oauth.refresh-token-ttl=${MCP_OAUTH_REFRESH_TOKEN_TTL:90d}
resumate.oauth.allowed-redirect-uri-patterns=${MCP_OAUTH_ALLOWED_REDIRECT_URI_PATTERNS:https://claude.ai/*}

resumate.mcp.idempotency.ttl=5m
