# Resumate Material MCP Server Configuration
# This server is for creating resume materials ONLY
# NEVER use this for tailoring CVs to job listings

# Server Configuration
server.port=8081

# Spring Configuration
spring.application.name=resumate-material-mcp

# PocketBase Configuration
pocketbase.base-url=http://localhost:8090
pocketbase.service-user-email=mcp@resumate.local
pocketbase.service-user-password=${POCKETBASE_SERVICE_PASSWORD:}

# MCP Server Configuration
spring.ai.mcp.server.name=Resumate Material MCP
spring.ai.mcp.server.description=Resumate MCP server for creating resume materials (projects, achievements, skills, etc.). NEVER use for tailoring CVs to job listings.
spring.ai.mcp.server.version=1.0.0

# SAFETY GUARD: Clear instructions for AI clients
spring.ai.mcp.server.instructions=\
IMPORTANT SAFETY RULES: \
1) This MCP is for creating standalone resume materials ONLY. \
2) NEVER create materials to fit a specific job listing. \
3) NEVER call CV profile or resume tailoring tools - they don't exist in this server. \
4) Always get explicit user confirmation before creating any material. \
5) Only use record IDs returned by listMaterial or similar tools. \
6) Do not invent qualifications or experience the user doesn't have.

# Logging
logging.level.com.resumate.materialmcp=INFO
logging.level.org.springframework.ai=INFO